[project]
name = "harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aleksa Ljujic", email = "alesa.ljujic2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.30.0",
    "numpy>=2.5.2",
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pygame>=2.6.1",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
    "tqdm>=4.70.0",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
]
swebench = [
    "swebench>=4.0.0",
]
