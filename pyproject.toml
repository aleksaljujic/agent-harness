[project]
name = "harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aleksa Ljujic", email = "alesa.ljujic2@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.1",
    "pandas>=3.0.5",
    "pathlib>=1.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.4",
    "scikit-learn>=1.9.0",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
